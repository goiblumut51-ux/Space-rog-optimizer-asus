name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Manual trigger

permissions:
  contents: write  # Ini penting! Biar GITHUB_TOKEN bisa upload APK [citation:1][citation:2]
  issues: write    # Biar bisa komen di PR kalau ada error
  pull-requests: write
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Decode Keystore (Kalau Punya)
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks
        fi
      shell: bash

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SpaceRogOptimizer.apk

    - name: Upload APK ke Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SpaceRogOptimizer
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload APK ke Release (Hanya kalau ada tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/SpaceRogOptimizer.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
